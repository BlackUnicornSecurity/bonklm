name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: the type-checked ESLint rules (recommendedTypeChecked)
      # resolve cross-package types via each workspace package's built
      # dist/*.d.ts. Without a build, connector imports of sibling error
      # classes are unresolved and produce false positives (e.g. the
      # @typescript-eslint/only-throw-error rule on `throw new XGuardError()`).
      - name: Build packages
        run: pnpm run build

      - name: Run lint
        run: pnpm run lint

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: tsc --noEmit resolves cross-package imports via each
      # workspace package's built dist/*.d.ts. Without a build, connector
      # packages that import workspace siblings fail type resolution.
      - name: Build packages
        run: pnpm run build

      - name: Run type check
        run: pnpm exec tsc --noEmit

  audit:
    name: Security Audit (informational)
    runs-on: ubuntu-latest
    # NOTE: This step is informational and does NOT fail the build.
    # `pnpm audit` walks the whole workspace lockfile regardless of working-directory,
    # so it surfaces advisories from connector peer deps (openclaw, mastra-related SDKs,
    # llamaindex/vercel `ai` deps, etc.) that we cannot patch upstream from here.
    # Auditing for advisories in the published packages happens at publish time
    # (see publish.yml). Dependabot handles routine bumps for our direct deps.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Surface advisory summary (non-blocking)
        run: pnpm audit --audit-level=high || true

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-node-${{ matrix.node-version }}
          path: packages/*/dist
          retention-days: 1

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run tests with coverage
        run: pnpm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == 22
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-node-22
          fail_ci_if_error: false

  uat:
    name: UAT Harness
    runs-on: ubuntu-latest
    # Sprint 34 architect HIGH closure: gate on `test` to avoid burning
    # runner minutes on commits where the core test suite is already red.
    needs: [test]
    # Sprint 33 lessons-learned closure: the UAT harness (`pnpm run uat`)
    # MUST be in the per-commit gate. Sprint 33 surfaced two latent bugs
    # (missing `tsx` devDep + UAT-INT-004 stale class-name lookup) that
    # had gone undetected through Sprints 28-32 because the UAT was not
    # in CI. Failing this job blocks the build.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (UAT imports compiled dist)
        run: pnpm --filter @blackunicorn/bonklm build

      - name: Run UAT harness
        run: pnpm run uat

      - name: Upload UAT HTML report (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-report
          path: packages/core/uat/reports/
          retention-days: 7
          if-no-files-found: ignore

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    # Sprint 34 architect HIGH closure: gate on `test` to avoid burning
    # runner minutes on commits where the core test suite is already red.
    needs: [test]
    # Sprint 33 lessons-learned closure: the benchmark suite
    # (`pnpm run benchmark`) MUST run on every commit. Sprint 33 surfaced
    # 120 lines of `[ERROR] Error in guard SecretGuard` spam plus a
    # `NaNx faster than` broken comparison that had survived multiple
    # sprints undetected. Per Sprint 33 lesson #5, ANY NaN / Infinity
    # in benchmark output is a broken-measurement signal and MUST fail
    # the build.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (benchmark may resolve workspace alias to dist)
        run: pnpm --filter @blackunicorn/bonklm build

      - name: Run benchmark suite
        # GitHub Actions bash already runs with `-e -o pipefail` by
        # default (since runner v2.285.0). Sprint 34 code-reviewer LOW:
        # the explicit `set -o pipefail` is redundant but kept for
        # self-documentation — the pipe-to-tee REQUIRES pipefail
        # semantics for the benchmark exit code to propagate.
        run: |
          set -o pipefail
          pnpm run benchmark 2>&1 | tee packages/core/benchmarks/.last-run.log

      - name: NaN / Infinity / Error-log guard
        # Catch broken measurements (NaN/Infinity from divide-by-zero,
        # missing data points, etc.) AND engine error-log spam during
        # the bench (Sprint 33 SecretGuard-context regression class).
        # A clean benchmark has zero `[ERROR]` lines from the engine
        # catch sites and zero `NaN`/`Infinity` in measurement output.
        #
        # Sprint 34 code-reviewer HIGH closure: regex widened from
        # `NaNx? faster` (only forward comparisons) to bare `\bNaN` /
        # `\bInfinity` so the inverse-direction `slower` / `ops/sec`
        # variants are also caught. False-positive risk in benchmark
        # output is negligible — neither token appears in legitimate
        # vitest bench summaries.
        run: |
          BENCH_LOG=packages/core/benchmarks/.last-run.log
          if grep -qE '\bNaN|\bInfinity' "$BENCH_LOG"; then
            echo "::error::Benchmark produced NaN/Infinity — broken measurement"
            grep -E '\bNaN|\bInfinity' "$BENCH_LOG"
            exit 1
          fi
          if grep -qE '\[ERROR\] Error in (guard|validator)' "$BENCH_LOG"; then
            echo "::error::Engine catch-site fired during benchmark — interface/contract violation"
            grep -E '\[ERROR\] Error in (guard|validator)' "$BENCH_LOG" | head -5
            exit 1
          fi

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output
          path: packages/core/benchmarks/.last-run.log
          retention-days: 7
          if-no-files-found: ignore

  sandbox-gate:
    name: Sandbox Graduation Gate (R2-13)
    runs-on: ubuntu-latest
    # Sprint 34 architect HIGH closure: gate on `test` to avoid burning
    # runner minutes on commits where the core test suite is already red.
    needs: [test]
    # Sprint 33 lessons-learned closure: the R2-13 hash-pinned sandbox
    # graduation gate MUST re-verify on every commit. The gate script
    # exits non-zero if recall < 95% OR FPR > 5% OR precision < 80%, OR
    # if the corpus hash drifts from the Sprint 24 pin
    # (db9c19...8fff4). Failing this job blocks the build.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (gate imports compiled validator dist)
        run: pnpm --filter @blackunicorn/bonklm build

      - name: Run R2-13 sandbox graduation gate
        run: node packages/core/benchmarks/sandbox-attack-corpus/run-graduation-gate.mjs

      - name: Upload graduation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-graduation-report
          path: |
            packages/core/benchmarks/sandbox-attack-corpus/graduation-report.json
            packages/core/benchmarks/sandbox-attack-corpus/graduation-report.txt
          retention-days: 30
          # Sprint 34 code-reviewer HIGH closure: the gate script
          # writes both files unconditionally before exit. A missing
          # report means the script crashed before evaluation completed
          # — that's a harder failure mode than a non-zero gate-decision
          # exit and MUST surface as a CI error rather than silently
          # being ignored.
          if-no-files-found: error

  temporal-integration:
    name: Temporal Integration (TestWorkflowEnvironment)
    runs-on: ubuntu-latest
    # Sprint 36 closure of Sprint 35 deferral: flip the
    # `BONKLM_TEMPORAL_INTEGRATION_TESTS=1` gate so the full
    # TestWorkflowEnvironment-backed suite actually runs in CI. The
    # gate stays default-OFF for local-dev iteration (per the
    # test-file env-var check) — this job is the canonical CI consumer.
    #
    # Closes Sprint 35 architect MEDIUM M-2 (binary caching).
    # Sprint 36 security-audit correction (security MEDIUM-7): this
    # job CAPTURES the post-download SHA as a forensic audit trail.
    # That is the prerequisite observation for Sprint 37 closure of
    # the security MEDIUM (post-download SHA verification gap). The
    # enforce step — `shasum -c` against a pinned hash BEFORE the
    # binary executes — lands in Sprint 37 once the first green CI
    # run produces a SHA the maintainer can review + pin (local
    # network policy blocks `temporal.download` so first observation
    # MUST come from CI).
    needs: [test]
    # Sprint 36 architect LOW-2: bound the worst-case hang. The
    # first-run binary download + cluster bring-up is bounded
    # generously, but a wedged TestWorkflowEnvironment would otherwise
    # burn the default 6h runner cap.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Sprint 36 architect-MEDIUM closure: cache the ~50MB
      # temporal-test-server binary across runs. First-run cost ~30s
      # (download + extract); cached runs spin up in <2s. Key is
      # versioned by pnpm-lock so a @temporalio/testing bump
      # automatically invalidates the cache and triggers re-download.
      - name: Cache Temporal test-server binary
        id: temporal-cache
        uses: actions/cache@v4
        with:
          path: ~/.config/temporalio
          key: temporalio-test-server-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            temporalio-test-server-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        # The integration test imports the compiled
        # `createValidateInputActivity` from the temporal-middleware
        # dist + the @blackunicorn/bonklm barrel.
        run: pnpm run build

      - name: Run TestWorkflowEnvironment integration suite
        env:
          BONKLM_TEMPORAL_INTEGRATION_TESTS: '1'
        # Sprint 36 code-reviewer MEDIUM: invoke vitest via `pnpm
        # exec` (workspace-pinned binary from `node_modules/.bin`)
        # rather than `npx vitest` (which can resolve a different
        # registry version than `pnpm-lock.yaml` records). Keeps the
        # integration job's vitest in lockstep with the rest of the
        # CI matrix.
        # Sprint 36 architect MEDIUM M-3: tee vitest output so the
        # full transcript is captured on both pass and fail (the
        # default GH Actions log truncates noisy stack traces).
        run: |
          set -o pipefail
          pnpm exec vitest run \
            packages/temporal-middleware/tests/test-workflow-environment.test.ts \
            2>&1 | tee temporal-integration.log

      - name: Upload Temporal integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-integration-log
          path: temporal-integration.log
          retention-days: 7
          if-no-files-found: ignore

      # Sprint 36 captures the SHA of the binary @temporalio/testing
      # downloaded into ~/.config/temporalio. The Sprint 37 enforce
      # step pins this SHA in a checked-in `.ci/temporal-test-server-
      # sha256.txt` and runs `shasum -c` BEFORE the integration test
      # executes (currently the test runs first; that ordering MUST
      # invert in Sprint 37 — see SECURITY-AUDIT note above).
      #
      # Capture/enforce split is the standard supply-chain control
      # bootstrap pattern: the maintainer cannot pin a SHA they have
      # not yet observed. Local download is firewall-blocked, so
      # first observation MUST come from CI.
      - name: Capture Temporal binary SHA-256
        if: always()
        # Sprint 36 code-reviewer HIGH: advisory capture step MUST
        # NOT fail the job on a `shasum` / `find` error (e.g.
        # permission denied on a transient FS state). Pipeline guard
        # with `|| true` so the upload-artifact step still runs.
        # Sprint 36 architect M-1 + code-reviewer MEDIUM: drop the
        # `-perm -111` branch — it required ALL three execute bits
        # (GNU find semantics), which would miss `0755`-mode
        # binaries. The `-name 'temporal-test-server*'` predicate
        # alone gives a tight, enforce-ready manifest (any Temporal
        # helper executables shipped alongside the test server would
        # otherwise inflate the manifest and complicate Sprint 37
        # `shasum -c` review).
        run: |
          SHA_FILE=temporal-test-server-shas.txt
          : > "$SHA_FILE"
          if [ -d ~/.config/temporalio ]; then
            find ~/.config/temporalio -type f -name 'temporal-test-server*' -print0 2>/dev/null \
              | xargs -0 -r shasum -a 256 \
              | tee "$SHA_FILE" \
              || true
          fi
          if [ ! -s "$SHA_FILE" ]; then
            echo "::warning::No Temporal binary found under ~/.config/temporalio after integration run"
          fi

      - name: Upload Temporal binary SHA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-test-server-shas
          path: temporal-test-server-shas.txt
          retention-days: 30
          if-no-files-found: ignore
