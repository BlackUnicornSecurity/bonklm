name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: the type-checked ESLint rules (recommendedTypeChecked)
      # resolve cross-package types via each workspace package's built
      # dist/*.d.ts. Without a build, connector imports of sibling error
      # classes are unresolved and produce false positives (e.g. the
      # @typescript-eslint/only-throw-error rule on `throw new XGuardError()`).
      - name: Build packages
        run: pnpm run build

      - name: Run lint
        run: pnpm run lint

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

  changeset-linked:
    name: Changeset Linked-Group Drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # Dependency-free Node script (reads packages/*/package.json +
      # .changeset/config.json) — no pnpm install or build needed. Asserts the
      # changesets `linked` group equals the publishable packages/* set so the
      # release-surface list cannot silently drift stale as connectors are added.
      - name: Assert changeset linked group == publishable packages
        run: node tools/check-changeset-linked.js

  release-plan:
    name: Version-Locked Release Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert active release plan keeps all publishable packages version-locked
        env:
          CHANGESET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm run check:release-plan

      - name: Assert current root and package manifests share one version
        run: bash scripts/check-version-pin.sh

  container:
    name: Container Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Build release image
        run: pnpm run docker:build

      - name: Verify image version, non-root user, and health endpoint
        run: |
          VERSION="$(node -p "require('./packages/bonklm-server/package.json').version")"
          pnpm run docker:smoke -- "ghcr.io/blackunicornsecurity/bonklm-server:${VERSION}" "$VERSION" linux/amd64

  workspace-policy:
    name: Workspace Tiering Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # Dependency-free Node script (reads tools/*/package.json +
      # packages/*/package.json) — no pnpm install or build needed. Asserts every
      # tools/* package is a valid Tier A (private) or Tier B (publishable opt-in)
      # member and that no Tier A tool leaks into a packages/* consumer's runtime deps.
      - name: Assert tools/* workspace tiering policy
        run: node tools/check-workspace-policy.js

  ee-boundary:
    name: EE License Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # Dependency-free Node script (reads packages/*/package.json + each OSS
      # package's source tree) — no pnpm install or build needed. Classifies every
      # package OSS (Apache-2.0) vs EE (BUSL-1.1) and fails if an OSS package
      # imports an EE package (static or dynamic), enforcing the load-bearing
      # invariant that the Apache core builds/tests with packages/bonklm-ee/* absent.
      # At v1.0 (zero ee packages) it passes trivially — a tripwire for the first
      # v1.1 ee package.
      - name: Assert OSS-EE license boundary
        run: node tools/check-ee-boundary.js

  edge-node-builtins:
    name: Edge node:* Allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      # Dependency-free Node script (statically walks packages/core/src/edge's
      # transitive source imports) — no pnpm install or build needed. Asserts the
      # set of node:* built-ins reachable from the edge subpath entry equals the
      # allowlist documented in architecture.md §6, so a future edge-exported
      # factory cannot silently drag a new Node built-in into the edge graph
      # (which would break the Deno/Bun/workerd portability contract).
      - name: Assert edge node:* built-in allowlist
        run: node tools/check-edge-node-builtins.js

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: tsc --noEmit resolves cross-package imports via each
      # workspace package's built dist/*.d.ts. Without a build, connector
      # packages that import workspace siblings fail type resolution.
      - name: Build packages
        run: pnpm run build

      - name: Run type check
        run: pnpm exec tsc --noEmit

  type-surface:
    name: Type Surface (tsd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: tsd resolves each package's published `types` entry
      # (dist/*.d.ts). Without a build the per-package suites cannot resolve
      # the package-under-test or its built workspace siblings.
      - name: Build packages
        run: pnpm run build

      - name: Run type-surface tests (tsd)
        run: pnpm run test:types

  tarball-drift:
    name: Tarball Drift (npm pack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: `npm pack` snapshots each package's built, gitignored
      # dist/. Without a build the shipped file set is missing all dist files
      # and every snapshot mismatches.
      - name: Build packages
        run: pnpm run build

      # tsc never cleans dist/: a renamed/deleted src file leaves orphaned
      # emit that would ride the tarball. Fail fast with the named class
      # before the (opaque) snapshot diffs below.
      - name: Assert no stale dist emit (src↔dist bijection)
        run: node tools/check-stale-dist.js

      - name: Run tarball-drift snapshot tests
        run: pnpm run test:pack

  audit:
    name: Security Audit (informational)
    runs-on: ubuntu-latest
    # NOTE: This step is informational and does NOT fail the build.
    # `pnpm audit` walks the whole workspace lockfile regardless of working-directory,
    # so it surfaces advisories from connector peer deps (openclaw, mastra-related SDKs,
    # llamaindex/vercel `ai` deps, etc.) that we cannot patch upstream from here.
    # Auditing for advisories in the published packages happens at publish time
    # (see publish.yml). Dependabot handles routine bumps for our direct deps.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Surface advisory summary (non-blocking)
        run: pnpm audit --audit-level=high || true

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-node-${{ matrix.node-version }}
          path: packages/*/dist
          retention-days: 1

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install commit-pinned secret scanner
        uses: ./.github/actions/install-gitleaks

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run tests with coverage
        run: pnpm exec vitest run --coverage

      - name: Enforce changed-code line and branch coverage
        env:
          DIFF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm run check:diff-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: matrix.node-version == 22
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-node-22
          fail_ci_if_error: false

  uat:
    name: UAT Harness
    runs-on: ubuntu-latest
    # Sprint 34 architect HIGH closure: gate on `test` to avoid burning
    # runner minutes on commits where the core test suite is already red.
    needs: [test]
    # Sprint 33 lessons-learned closure: the UAT harness (`pnpm run uat`)
    # MUST be in the per-commit gate. Sprint 33 surfaced two latent bugs
    # (missing `tsx` devDep + UAT-INT-004 stale class-name lookup) that
    # had gone undetected through Sprints 28-32 because the UAT was not
    # in CI. Failing this job blocks the build.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (UAT imports compiled dist)
        run: pnpm --filter @blackunicorn/bonklm build

      - name: Run security-regression baseline gate
        run: node packages/core/benchmarks/security-regression/run-gate.mjs

      - name: Run UAT harness
        run: pnpm run uat

      - name: Upload UAT HTML report (if generated)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uat-report
          path: packages/core/uat/reports/
          retention-days: 7
          if-no-files-found: ignore

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    # Sprint 34 architect HIGH closure: gate on `test` to avoid burning
    # runner minutes on commits where the core test suite is already red.
    needs: [test]
    # Sprint 33 lessons-learned closure: the benchmark suite
    # (`pnpm run benchmark`) MUST run on every commit. Sprint 33 surfaced
    # 120 lines of `[ERROR] Error in guard SecretGuard` spam plus a
    # `NaNx faster than` broken comparison that had survived multiple
    # sprints undetected. Per Sprint 33 lesson #5, ANY NaN / Infinity
    # in benchmark output is a broken-measurement signal and MUST fail
    # the build.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (benchmark may resolve workspace alias to dist)
        run: pnpm --filter @blackunicorn/bonklm build

      - name: Run benchmark suite
        # GitHub Actions bash already runs with `-e -o pipefail` by
        # default (since runner v2.285.0). Sprint 34 code-reviewer LOW:
        # the explicit `set -o pipefail` is redundant but kept for
        # self-documentation — the pipe-to-tee REQUIRES pipefail
        # semantics for the benchmark exit code to propagate.
        run: |
          set -o pipefail
          pnpm run benchmark 2>&1 | tee packages/core/benchmarks/.last-run.log

      - name: NaN / Infinity / Error-log guard
        # Catch broken measurements (NaN/Infinity from divide-by-zero,
        # missing data points, etc.) AND engine error-log spam during
        # the bench (Sprint 33 SecretGuard-context regression class).
        # A clean benchmark has zero `[ERROR]` lines from the engine
        # catch sites and zero `NaN`/`Infinity` in measurement output.
        #
        # Sprint 34 code-reviewer HIGH closure: regex widened from
        # `NaNx? faster` (only forward comparisons) to bare `\bNaN` /
        # `\bInfinity` so the inverse-direction `slower` / `ops/sec`
        # variants are also caught. False-positive risk in benchmark
        # output is negligible — neither token appears in legitimate
        # vitest bench summaries.
        run: |
          BENCH_LOG=packages/core/benchmarks/.last-run.log
          if grep -qE '\bNaN|\bInfinity' "$BENCH_LOG"; then
            echo "::error::Benchmark produced NaN/Infinity — broken measurement"
            grep -E '\bNaN|\bInfinity' "$BENCH_LOG"
            exit 1
          fi
          if grep -qE '\[ERROR\] Error in (guard|validator)' "$BENCH_LOG"; then
            echo "::error::Engine catch-site fired during benchmark — interface/contract violation"
            grep -E '\[ERROR\] Error in (guard|validator)' "$BENCH_LOG" | head -5
            exit 1
          fi

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-output
          path: packages/core/benchmarks/.last-run.log
          retention-days: 7
          if-no-files-found: ignore

  sandbox-gate:
    name: Sandbox Graduation Gate (R2-13)
    runs-on: ubuntu-latest
    # Sprint 34 architect HIGH closure: gate on `test` to avoid burning
    # runner minutes on commits where the core test suite is already red.
    needs: [test]
    # Sprint 33 lessons-learned closure: the R2-13 hash-pinned sandbox
    # graduation gate MUST re-verify on every commit. The gate script
    # exits non-zero if recall < 95% OR FPR > 5% OR precision < 80%, OR
    # if the corpus hash drifts from the Sprint 24 pin
    # (e3661e...5302b). Failing this job blocks the build.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (gate imports compiled validator dist)
        run: pnpm --filter @blackunicorn/bonklm build

      - name: Run R2-13 sandbox graduation gate
        run: node packages/core/benchmarks/sandbox-attack-corpus/run-graduation-gate.mjs

      - name: Upload graduation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-graduation-report
          path: |
            packages/core/benchmarks/sandbox-attack-corpus/graduation-report.json
            packages/core/benchmarks/sandbox-attack-corpus/graduation-report.txt
          retention-days: 30
          # Sprint 34 code-reviewer HIGH closure: the gate script
          # writes both files unconditionally before exit. A missing
          # report means the script crashed before evaluation completed
          # — that's a harder failure mode than a non-zero gate-decision
          # exit and MUST surface as a CI error rather than silently
          # being ignored.
          if-no-files-found: error

  temporal-integration:
    name: Temporal Integration (TestWorkflowEnvironment)
    runs-on: ubuntu-latest
    # Sprint 36 closure of Sprint 35 deferral: flip the
    # `BONKLM_TEMPORAL_INTEGRATION_TESTS=1` gate so the full
    # TestWorkflowEnvironment-backed suite actually runs in CI. The
    # gate stays default-OFF for local-dev iteration (per the
    # test-file env-var check) — this job is the canonical CI consumer.
    #
    # Closes Sprint 35 architect MEDIUM M-2 (binary caching).
    # Sprint 36 security-audit correction (security MEDIUM-7): this
    # job CAPTURES the post-download SHA as a forensic audit trail.
    # That is the prerequisite observation for Sprint 37 closure of
    # the security MEDIUM (post-download SHA verification gap). The
    # enforce step — `shasum -c` against a pinned hash BEFORE the
    # binary executes — lands in Sprint 37 once the first green CI
    # run produces a SHA the maintainer can review + pin (local
    # network policy blocks `temporal.download` so first observation
    # MUST come from CI).
    needs: [test]
    # Sprint 36 architect LOW-2: bound the worst-case hang. The
    # first-run binary download + cluster bring-up is bounded
    # generously, but a wedged TestWorkflowEnvironment would otherwise
    # burn the default 6h runner cap.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Temporal test-server binary
        id: temporal-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/bonklm-temporal/temporal-test-server
          key: temporal-test-server-linux-amd64-daa58458d32f6254

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Temporal test server before execution
        run: |
          set -euo pipefail
          BINARY="$RUNNER_TEMP/bonklm-temporal/temporal-test-server"
          BINARY_SHA=daa58458d32f6254a901085c27ad1c19a64a4e171679ed08b5b92c298baba6ce
          if [ ! -f "$BINARY" ]; then
            ARCHIVE="$RUNNER_TEMP/temporal-test-server.tgz"
            mkdir -p "$(dirname "$BINARY")"
            curl --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 10 --max-time 120 -fsSL \
              https://github.com/temporalio/sdk-java/releases/download/v1.38.0/temporal-test-server_1.38.0_linux_amd64.tar.gz \
              -o "$ARCHIVE"
            echo "41df834fe8e1ac59619e13908f41b63e4d1054f37634a2f89033d8cf6af71b96  $ARCHIVE" | shasum -a 256 -c -
            tar -xOf "$ARCHIVE" temporal-test-server_1.38.0_linux_amd64/temporal-test-server > "$BINARY"
            chmod 0755 "$BINARY"
          fi
          echo "$BINARY_SHA  $BINARY" | shasum -a 256 -c -
          echo "BONKLM_TEMPORAL_TEST_SERVER=$BINARY" >> "$GITHUB_ENV"

      - name: Build packages
        # The integration test imports the compiled
        # `createValidateInputActivity` from the temporal-middleware
        # dist + the @blackunicorn/bonklm barrel.
        run: pnpm run build

      - name: Run TestWorkflowEnvironment integration suite
        env:
          BONKLM_TEMPORAL_INTEGRATION_TESTS: '1'
        # Sprint 36 code-reviewer MEDIUM: invoke vitest via `pnpm
        # exec` (workspace-pinned binary from `node_modules/.bin`)
        # rather than `npx vitest` (which can resolve a different
        # registry version than `pnpm-lock.yaml` records). Keeps the
        # integration job's vitest in lockstep with the rest of the
        # CI matrix.
        # Sprint 36 architect MEDIUM M-3: tee vitest output so the
        # full transcript is captured on both pass and fail (the
        # default GH Actions log truncates noisy stack traces).
        run: |
          set -o pipefail
          pnpm exec vitest run \
            packages/temporal-middleware/tests/test-workflow-environment.test.ts \
            2>&1 | tee temporal-integration.log

      - name: Upload Temporal integration log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: temporal-integration-log
          path: temporal-integration.log
          retention-days: 7
          if-no-files-found: ignore
