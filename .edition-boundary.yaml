# BonkLM OSS↔EE edition boundary (complements ADR-0007, authoritative in-repo).
# BonkLM open-core: Apache-2.0 community core (validators/guards/engine/hooks + all connectors)
# ships; the BSL-1.1 enterprise tier (curated rule content, signed threat-feed, industry policy
# packs, control-mapping evidence export, advanced detectors, governance primitives) must not.
# This complements ADR-0007 "OSS↔EE license-boundary CI guard" (authoritative in-repo).
# Enterprise package globs verified against the monorepo.
edition_model: open-core

public_allowlist:
  - "packages/core/**"
  - "packages/connectors/**"
  - "docs/**"

ee_paths:
  - "packages/enterprise/**"
  - "packages/*-ee/**"
  - "**/threat-feed/**"

forbidden_imports:
  - "@blackunicorn/.*-ee"
  - 'from \S+\.enterprise'

forbidden_tokens:
  - "192.168."
  - "registry.internal"

never_public:
  - "team/**"                        # security-incident tracking lives here (disclosure policy)
  - "**/fixtures/customer/**"
